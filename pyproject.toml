[project]
name = "ipa-exam-rag"
version = "0.1.0"
description = "IPA Examination Retrieval-Augmented Generation (RAG) System with Self-Growing Knowledge Base"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "qdrant-client>=1.11.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name (e.g. AnswerKey.I for Japanese 'イ')
    "E402",  # module level import not at top of file (sys.path configuration)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
# スタブ未整備の外部ライブラリはモジュール単位で ignore_missing_imports を適用
# （strict モードの他の検査はすべて有効のまま維持する）

[[tool.mypy.overrides]]
module = [
    "google.*",
    "google.genai.*",
    "qdrant_client.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
]
